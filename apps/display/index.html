<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overhead Display</title>
    <link rel="stylesheet" href="./display.css">
    <link rel="stylesheet" href="./display-themes.css">
    <script type="module" src="./display-theme.js"></script>
    <script type="module" src="./location.js"></script>
  </head>
  <body>
    <main class="display" aria-label="Nearby aircraft">
      <div class="display-landscape" aria-hidden="true"><span class="landscape-acacia"></span></div>
      <p id="nearby-status" class="display-status" role="status">Set the display location in Settings.</p>
      <ul id="nearby-aircraft" class="flight-list" aria-label="Nearby aircraft" hidden></ul>
      <noscript>Enable JavaScript to show nearby aircraft.</noscript>
    </main>

    <button id="open-display-settings" class="settings-button" type="button" aria-label="Settings" aria-haspopup="dialog" aria-controls="display-settings" disabled>
      <span id="preview-indicator" aria-hidden="true" hidden>Preview</span><span aria-hidden="true">⚙</span>
    </button>

    <dialog id="display-settings" aria-labelledby="settings-title">
      <header class="settings-header">
        <h2 id="settings-title">Display settings</h2>
        <form method="dialog"><button type="submit" autofocus>Done</button></form>
      </header>
      <section aria-labelledby="theme-title">
        <h3 id="theme-title"><label for="display-theme">Theme</label></h3>
        <select id="display-theme" autocomplete="off">
          <option value="forest-green" selected>Forest Green</option>
          <option value="deep-blue">Deep Blue</option>
          <option value="deep-red">Deep Red</option>
          <option value="sky-gradient">Sky Gradient</option>
          <option value="nordic-linen">Nordic Linen</option>
          <option value="blueprint">Blueprint</option>
          <option value="walnut-and-brass">Walnut and Brass</option>
          <option value="serengeti-safari">Serengeti Safari</option>
          <option value="zanzibar-coast">Zanzibar Coast</option>
        </select>
      </section>
      <section aria-labelledby="preview-title">
        <h3 id="preview-title"><label for="traffic-preview">Traffic preview</label></h3>
        <select id="traffic-preview" autocomplete="off">
          <option value="0" selected>Live traffic</option>
          <option value="1">1 sample aircraft</option>
          <option value="2">2 sample aircraft</option>
          <option value="3">3 sample aircraft</option>
        </select>
        <button id="preview-handoff" type="button">Play sample handoff</button>
      </section>
      <section aria-labelledby="motion-title">
        <h3 id="motion-title">Transitions</h3>
        <div class="motion-settings">
          <label for="motion-duration">Slot move duration
            <select id="motion-duration" autocomplete="off">
              <option value="0">Off</option>
              <option value="700">0.7 seconds</option>
              <option value="900">0.9 seconds</option>
              <option value="1100" selected>1.1 seconds</option>
              <option value="1300">1.3 seconds</option>
              <option value="1600">1.6 seconds</option>
            </select>
          </label>
          <label for="motion-easing">Aircraft easing
            <select id="motion-easing" autocomplete="off">
              <option value="gentle" selected>Gentle</option>
              <option value="ease-in-out">Ease in and out</option>
              <option value="linear">Linear</option>
            </select>
          </label>
        </div>
      </section>
      <section aria-labelledby="radius-title">
        <h3 id="radius-title">Nearby</h3>
        <form id="nearby-radius-form" hidden>
          <label for="nearby-radius">Radius (km)</label>
          <input id="nearby-radius" type="number" min="1" step="1" inputmode="numeric" required>
          <button type="submit">Apply radius</button>
          <p class="setting-status"><small id="nearby-range">Within 50 km</small> <small id="nearby-radius-status" role="status"></small></p>
        </form>
      </section>
      <section aria-labelledby="location-title">
        <h3 id="location-title">Location</h3>
        <p id="saved-location-status" class="setting-status" role="status"></p>
        <div class="setting-actions">
          <button id="check-location" type="button" disabled>Check location</button>
          <button id="check-ip-location" type="button" disabled>Estimate from IP</button>
        </div>
        <p id="location-status" class="setting-status" role="status"></p>
        <p id="ip-location-status" class="setting-status" role="status"></p>
        <button id="save-ip-location" type="button" hidden>Save this estimate</button>
        <details id="location-settings" hidden>
          <summary>Set display location</summary>
          <form id="location-form">
            <div class="coordinate-fields">
              <label for="latitude">Latitude<input id="latitude" type="number" min="-90" max="90" step="any" required></label>
              <label for="longitude">Longitude<input id="longitude" type="number" min="-180" max="180" step="any" required></label>
            </div>
            <button type="submit">Save location</button>
          </form>
        </details>
      </section>
      <footer class="settings-sources">
        <p id="nearby-updated" class="setting-status"></p>
        <p class="setting-status"><a href="../companion/#data-sources" target="_blank" rel="noopener">Data sources</a></p>
      </footer>
    </dialog>

    <template id="flight-card-template">
      <li class="flight-card">
        <article class="flight-card-content">
          <header class="flight-topline">
            <div class="flight-identity">
              <strong class="flight-name"></strong>
              <p class="flight-description"></p>
            </div>
            <div class="flight-instruments">
              <div class="flight-readout">
                <span class="flight-distance"></span>
                <div class="flight-values">
                  <span class="flight-altitude"><span class="sr-only">Altitude </span><span class="flight-altitude-value"></span></span>
                  <span class="flight-speed"><span class="sr-only">Ground speed </span><span class="flight-speed-value"></span></span>
                </div>
              </div>
              <div class="flight-track" role="img">
                <span class="flight-needle" aria-hidden="true"></span>
              </div>
            </div>
          </header>
          <div class="flight-picture">
            <div class="flight-art"></div>
            <div class="flight-route" role="img"></div>
          </div>
        </article>
      </li>
    </template>
  </body>
</html>
