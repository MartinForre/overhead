<html lang="en">
  <head>

  <body>
    <main>
      <h1>Overhead Companion</h1>
      <section id="data-sources" aria-labelledby="data-sources-title">
        <h2 id="data-sources-title">Data sources</h2>
        <ul>
          <li>Live aircraft positions from <a href="https://adsb.fi/">adsb.fi</a>.</li>
          <li>Backup aircraft positions from <a href="https://www.adsb.lol/docs/open-data/api">adsb.lol</a>, available under the <a href="https://opendatacommons.org/licenses/odbl/1-0/">Open Database License (ODbL) 1.0</a>.</li>
          <li>Aircraft, airline, and route reference data from <a href="https://www.adsbdb.com/">ADSBDB</a>.</li>
        </ul>
      </section>
    </main>
  </body>
