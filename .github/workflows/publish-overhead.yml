name: Publish Overhead

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish a prerelease for manual testing
        type: boolean
        default: false

concurrency:
  group: publish-overhead
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8
      - run: npm ci
      - run: node --test
      - run: python3 -m unittest discover -s deploy/pi -p 'test_*.py'
      - run: npm run build:pi
        env:
          OVERHEAD_BUILD_NUMBER: ${{ github.run_number }}
          OVERHEAD_BUILD_COMMIT: ${{ github.sha }}
      - name: Verify the compiled ARM64 executable
        shell: bash
        run: |
          working="$(mktemp -d)"
          binary="$PWD/dist/pi/overhead-linux-arm64"
          (cd "$working"; exec "$binary" --managed --port 8101) &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; rmdir "$working"' EXIT
          curl -fsS --retry 5 --retry-connrefused http://127.0.0.1:8101/healthz |
            jq -e --argjson build "$GITHUB_RUN_NUMBER" --arg commit "$GITHUB_SHA" '.number == $build and .commit == $commit'
          curl -fsS http://127.0.0.1:8101/api/settings | jq -e '.mode == "live"'
          curl -fsS -o /dev/null http://127.0.0.1:8101/display/display.js
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="build-$GITHUB_RUN_NUMBER"
          stable="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName)"
          newest="$(jq '[.[].tagName | select(test("^build-[1-9][0-9]*$")) | sub("^build-"; "") | tonumber] | max // 0' <<< "$stable")"
          if [[ "$PRERELEASE" == false ]] && (( newest > GITHUB_RUN_NUMBER )); then
            echo "A newer stable release already exists."
            exit 1
          fi
          releases="$(gh release list --limit 100 --json tagName,isDraft)"
          draft="$(jq -r --arg tag "$tag" '.[] | select(.tagName == $tag) | .isDraft' <<< "$releases")"
          if [[ "$draft" == false ]]; then
            echo "$tag is already published."
            exit 0
          fi
          title="Overhead build $GITHUB_RUN_NUMBER · $(date -u '+%Y-%m-%d %H:%M UTC')"
          if [[ "$draft" != true ]]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --generate-notes --draft
          fi
          gh release upload "$tag" dist/pi/overhead-linux-arm64.gz --clobber
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --latest
          fi
